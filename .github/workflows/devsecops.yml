# EPIC-019A — DevSecOps: Trivy, CycloneDX SBOM, dependency / secret scans
name: DevSecOps

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Trivy JSON
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: docs/devsecops/trivy-fs.json
          exit-code: "0"
      - name: Write TRIVY_REPORT.md
        run: |
          mkdir -p docs/devsecops
          {
            echo "# TRIVY REPORT — EPIC-019A"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Runner | GitHub Actions ubuntu-latest |"
            echo "| Scan | filesystem (vuln) |"
            echo "| JSON | \`docs/devsecops/trivy-fs.json\` |"
            echo "| SARIF | \`trivy-fs.sarif\` |"
            echo ""
            echo "## Notes"
            echo ""
            echo "- \`exit-code: 0\` so the workflow always publishes artefacts; severity triage is manual/board."
            echo "- Container image scan is a separate job when Docker build context is available."
            echo ""
          } > docs/devsecops/TRIVY_REPORT.md
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs
          path: |
            docs/devsecops/trivy-fs.json
            docs/devsecops/TRIVY_REPORT.md
            trivy-fs.sarif

  trivy-image:
    name: Trivy container image (API Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: |
          if [ -f docker/backend/Dockerfile ]; then
            docker build -f docker/backend/Dockerfile -t dsp-api:devsecops .
          elif [ -f Dockerfile ]; then
            docker build -t dsp-api:devsecops .
          else
            echo "No Dockerfile found — skipping image build"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Trivy image scan
        if: env.SKIP != '1'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: dsp-api:devsecops
          format: json
          output: docs/devsecops/trivy-image.json
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: trivy-image
          path: docs/devsecops/trivy-image.json

  sbom-cyclonedx:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Lite SBOM + npm CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          python scripts/ops/generate_sbom.py
          cd apps/web
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --output-file ../../docs/devsecops/sbom-web.cdx.json --ignore-npm-errors
      - name: Write SBOM_REPORT.md
        run: |
          mkdir -p docs/devsecops
          {
            echo "# SBOM REPORT — EPIC-019A"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Generated | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Lite Python/Web | docs/security/sbom-*-lite.json |"
            echo "| CycloneDX npm | docs/devsecops/sbom-web.cdx.json |"
            echo ""
            echo "Generated by CI job \`sbom-cyclonedx\`."
          } > docs/devsecops/SBOM_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            docs/security/sbom-*.json
            docs/security/SBOM_GENERATION_REPORT.md
            docs/devsecops/sbom-web.cdx.json
            docs/devsecops/SBOM_REPORT.md

  dependency-license:
    name: Dependency + license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit + license list
        working-directory: apps/web
        run: |
          npm ci
          npm audit --json > ../../docs/devsecops/npm-audit.json || true
          npx --yes license-checker --json > ../../docs/devsecops/npm-licenses.json || true
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[dev]" || true
          pip-audit --format json -o docs/devsecops/pip-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-scans
          path: docs/devsecops/

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual-qa:
    name: Playwright visual + browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
      - name: Browser smoke
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/browser --project=chromium --project=firefox --project=webkit
      - name: Visual regression
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/visual --project=chromium
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-results.json
