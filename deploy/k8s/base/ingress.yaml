apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsp
  namespace: dsp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.your-domain.example
        - api.your-domain.example
      secretName: dsp-tls
  rules:
    - host: app.your-domain.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsp-web
                port:
                  number: 3000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: dsp-api
                port:
                  number: 8000
    - host: api.your-domain.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsp-api
                port:
                  number: 8000
