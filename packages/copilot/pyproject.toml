[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.5.0"
description = "DSP AI Copilot — frozen conversation / explanation bounded context (J1.0–J1.4)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "core",
]

[tool.setuptools.packages.find]
where = ["src"]
