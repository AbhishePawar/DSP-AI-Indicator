[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-platform"
version = "0.3.0"
description = "DSP Production Services — ops ports (K1.3 + PEP-002 + PEP-003)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "core",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.34"]
infra = ["psycopg[binary]>=3.1", "redis>=5.0", "boto3>=1.34"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
prometheus = ["prometheus_client>=0.20"]
observability = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "prometheus_client>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]
