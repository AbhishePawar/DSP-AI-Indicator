name: Refresh web dependency lock (temporary)

on:
  push:
    branches:
      - fix/deployment-readiness-20261014

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-readiness-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Resolve updated frontend dependencies
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "fix(deps): refresh frontend lockfile"
          git push origin HEAD:fix/deployment-readiness-20261014
