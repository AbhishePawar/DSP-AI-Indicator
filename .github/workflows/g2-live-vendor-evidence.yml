name: G2 Live Authenticated Vendor Evidence

# Authoritative G2 drill — single definition used by:
#   * manual workflow_dispatch (diagnostic / force-close)
#   * release.yml via workflow_call (RC1 hard prerequisite)
#
# Credentials MUST come from protected GitHub Environment ``live-data-evidence``.
# Soft-pass / fabricated live evidence is forbidden.
# Missing credential ⇒ job fails ⇒ RC1 NO-GO.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Liquid ticker for live smoke (default AAPL)"
        required: false
        default: "AAPL"
        type: string
  workflow_call:
    inputs:
      ticker:
        description: "Liquid ticker for live smoke (default AAPL)"
        required: false
        default: "AAPL"
        type: string

concurrency:
  group: g2-live-vendor-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  g2-live-vendor-evidence:
    name: Real authenticated vendor evidence (G2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-data-evidence

    env:
      DSP_ENVIRONMENT: production
      DSP_INFRA_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
      DSP_G2_TICKER: ${{ inputs.ticker || 'AAPL' }}
      # Preferred single-key FMP route (Environment ``live-data-evidence``).
      DSP_FMP_API_KEY: ${{ secrets.DSP_FMP_API_KEY }}
      DSP_INVESTMENT_FMP_API_KEY: ${{ secrets.DSP_INVESTMENT_FMP_API_KEY }}
      # Alternative ConfiguredHttp route.
      DSP_MARKET_QUOTE_API_KEY: ${{ secrets.DSP_MARKET_QUOTE_API_KEY }}
      DSP_MARKET_QUOTE_BASE_URL: ${{ secrets.DSP_MARKET_QUOTE_BASE_URL }}
      DSP_FINANCIAL_STATEMENT_API_KEY: ${{ secrets.DSP_FINANCIAL_STATEMENT_API_KEY }}
      DSP_FINANCIAL_STATEMENT_BASE_URL: ${{ secrets.DSP_FINANCIAL_STATEMENT_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monorepo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Credential / adapter diagnostic (no secret values)
        id: creds
        run: python scripts/ops/g2_provider_configuration_diagnostic.py

      - name: G2 live authenticated vendor drill
        id: drill
        run: python scripts/ops/g2_live_vendor_evidence_drill.py

      - name: Assert G2 clearance contract
        id: assert_clearance
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("artifacts/g2_live_vendor_evidence.json")
          if not path.is_file():
              print("G2 BLOCKED — evidence artifact missing", file=sys.stderr)
              sys.exit(1)

          data = json.loads(path.read_text(encoding="utf-8"))
          blob = json.dumps(data)
          if "Bearer " in blob:
              print("G2 BLOCKED — secret material detected in evidence", file=sys.stderr)
              sys.exit(1)

          ok = data.get("ok") is True
          status = data.get("g2_status")
          evidence_class = data.get("evidence_class")
          cleared = (
              ok
              and status == "CLEARED"
              and evidence_class == "real_live_authenticated_provider"
          )
          print(
              f"g2_contract ok={ok} g2_status={status} evidence_class={evidence_class}"
          )
          if not cleared:
              print(
                  "G2 BLOCKED — clearance contract failed "
                  f"(ok={ok!r}, g2_status={status!r}, evidence_class={evidence_class!r})",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("G2 CLEARANCE CONTRACT PASS")
          PY

      - name: Upload G2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-live-vendor-evidence
          path: artifacts/g2_live_vendor_evidence.json
          if-no-files-found: warn

      - name: G2 summary
        if: always()
        run: |
          {
            echo "## G2 Live Authenticated Vendor Evidence"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Job | ${{ job.status }} |"
            echo "| Drill | ${{ steps.drill.outcome }} |"
            echo "| Clearance assert | ${{ steps.assert_clearance.outcome }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ticker | \`${{ env.DSP_G2_TICKER }}\` |"
            echo "| Environment | \`live-data-evidence\` |"
            echo "| Preferred secret | \`DSP_FMP_API_KEY\` |"
            echo "| Hard-fail | true |"
            echo ""
            if [[ -f artifacts/g2_live_vendor_evidence.json ]]; then
              echo '```json'
              # Artifact is redacted by the drill; still do not echo env secrets.
              cat artifacts/g2_live_vendor_evidence.json
              echo '```'
            else
              echo "_No evidence artifact written._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
