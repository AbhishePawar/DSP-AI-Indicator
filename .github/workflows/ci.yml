name: CI

# ASI-007 — CI Quality
# Validates repository integrity, architecture boundaries, monorepo smoke,
# and the full package test suite. Product behaviour is not modified here.

on:
  push:
    branches: [main, master, 'feature/unified-multi-source-research']
  pull_request:
    branches: [main, master, 'copilot/frontend-auth-research-integration']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and type checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_PUBLIC_BUILD_TIMESTAMP: ${{ github.run_id }}
        run: npm run build

  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install monorepo (editable + dev/CI deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Repository integrity (discovery + imports)
        id: integrity
        run: |
          python scripts/ci_repository_integrity.py
          echo "integrity=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "## Repository integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "Registered package discovery and public exports verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Architecture tests (boundaries + cycles)
        id: architecture
        run: |
          mapfile -t ARCH_TESTS < <(find packages -type f \( -name 'test_architecture.py' -o -name 'test_architecture_*.py' \) | sort)
          echo "Architecture test modules: ${#ARCH_TESTS[@]}"
          printf '%s\n' "${ARCH_TESTS[@]}"
          pytest \
            "${ARCH_TESTS[@]}" \
            -q \
            --import-mode=importlib \
            -p no:cov \
            --tb=short
          {
            echo "## Architecture tests"
            echo "Executed ${#ARCH_TESTS[@]} architecture test modules (boundaries + cycles)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Monorepo smoke (public façades)
        id: smoke
        run: |
          pytest \
            packages/dsp_platform/tests/test_asi_monorepo_smoke.py \
            -q \
            --import-mode=importlib \
            -p no:cov \
            --tb=short
          echo "## Monorepo smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Import / \`__all__\` / critical façade smoke executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Full package test suite
        id: tests
        run: |
          pytest \
            packages \
            -q \
            --import-mode=importlib \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --tb=line
          echo "## Full test suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Monorepo \`packages/\` pytest completed with coverage XML artifact input." >> "$GITHUB_STEP_SUMMARY"

      - name: Lint with Ruff
        run: ruff check packages tests

      - name: Check formatting with Black
        run: black --check packages tests

      - name: Type check with mypy
        run: mypy

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          fail_ci_if_error: false
          files: coverage.xml

      - name: Quality gate summary
        if: always()
        run: |
          {
            echo "## ASI-007 CI summary"
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Integrity | ${{ steps.integrity.outcome }} |"
            echo "| Architecture | ${{ steps.architecture.outcome }} |"
            echo "| Smoke | ${{ steps.smoke.outcome }} |"
            echo "| Full tests | ${{ steps.tests.outcome }} |"
            echo "| Python | ${{ matrix.python-version }} |"
          } >> "$GITHUB_STEP_SUMMARY"



  staging-safety:
    name: Staging safety, readiness, and backup-restore (local fixtures)
    runs-on: ubuntu-latest
    env:
      DSP_ENVIRONMENT: development
      DSP_OBJECT_STORAGE_PROVIDER: memory
      DSP_INFRA_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monorepo (editable + dev/CI deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run staging safety, readiness, and backup-restore regressions
        id: regressions
        run: |
          pytest \
            packages/production_platform/tests/test_staging_safety.py \
            packages/api_platform/tests/test_staging_safety_api.py \
            packages/production_platform/tests/test_product_state_backup.py \
            packages/api_platform/tests/test_p108_backup_restore.py \
            packages/api_platform/tests/test_health_rc1.py \
            packages/api_platform/tests/test_ops_api.py \
            -v \
            --import-mode=importlib \
            -p no:cov \
            --tb=short

      - name: Staging safety regression summary
        if: always()
        run: |
          {
            echo "## Staging safety & backup-restore regressions"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ steps.regressions.outcome }} |"
            echo "| Scope | Staging fail-closed, health/readiness, logical backup-restore |"
            echo "| Fixtures | Local mocks / in-memory fakes only (no external services) |"
          } >> "$GITHUB_STEP_SUMMARY"
