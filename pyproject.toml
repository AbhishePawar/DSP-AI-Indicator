[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-ai-indicator"
version = "0.1.0"
description = "Institutional-grade AI equity research platform with DSP indicators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DSP AI Research" }]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    # CI / local test runtime for HTTP & security packages (ASI-007)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "pydantic>=2.0",
    # MFA TOTP secret-box (Fernet) — required so CI never persists plaintext seeds
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
where = [
    "packages/contracts/src",
    "packages/core/src",
    "packages/dsp/src",
    "packages/data_engine/src",
    "packages/fundamental/src",
    "packages/ai_committee/src",
