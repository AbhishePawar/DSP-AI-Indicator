[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.4.0"
description = "DSP Research Intelligence — assemble, synthesize, report (F1.0–F1.3)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "core",
]

[tool.setuptools.packages.find]
where = ["src"]
