apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsp
resources:
  - ../../base
images:
  - name: dsp-api
    newTag: 2.0.0
  - name: dsp-web
    newTag: 2.0.0
patches:
  - target:
      kind: Deployment
      name: dsp-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
