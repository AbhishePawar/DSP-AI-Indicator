name: G2 Live Authenticated Vendor Evidence

# G2 — real authenticated quote + statements → analyse → provenance.
# Credentials MUST come from the protected GitHub Environment
# ``live-data-evidence`` (manual workflow_dispatch). Never place vendor
# secrets in ordinary PR jobs. Soft-pass / fabricated live evidence is forbidden.
#
# Preferred: single secret DSP_FMP_API_KEY (Financial Modeling Prep free tier).
# Alternative: four ConfiguredHttp secrets (quote + statement key/URL).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Liquid ticker for live smoke (default AAPL)"
        required: false
        default: "AAPL"
  # Optional: allow re-runs from the remediation branch without auto-claiming
  # evidence when secrets are absent (job fails closed).
  workflow_call:

concurrency:
  group: g2-live-vendor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g2-live-vendor-evidence:
    name: Real authenticated vendor evidence (G2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-data-evidence

    env:
      DSP_ENVIRONMENT: production
      DSP_INFRA_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
      DSP_G2_TICKER: ${{ inputs.ticker || 'AAPL' }}
      # Preferred single-key FMP route (Environment ``live-data-evidence``).
      DSP_FMP_API_KEY: ${{ secrets.DSP_FMP_API_KEY }}
      DSP_INVESTMENT_FMP_API_KEY: ${{ secrets.DSP_INVESTMENT_FMP_API_KEY }}
      # Alternative ConfiguredHttp route.
      DSP_MARKET_QUOTE_API_KEY: ${{ secrets.DSP_MARKET_QUOTE_API_KEY }}
      DSP_MARKET_QUOTE_BASE_URL: ${{ secrets.DSP_MARKET_QUOTE_BASE_URL }}
      DSP_FINANCIAL_STATEMENT_API_KEY: ${{ secrets.DSP_FINANCIAL_STATEMENT_API_KEY }}
      DSP_FINANCIAL_STATEMENT_BASE_URL: ${{ secrets.DSP_FINANCIAL_STATEMENT_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monorepo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Credential / adapter diagnostic (no secret values)
        id: creds
        run: python scripts/ops/g2_provider_configuration_diagnostic.py

      - name: G2 live authenticated vendor drill
        id: drill
        run: python scripts/ops/g2_live_vendor_evidence_drill.py

      - name: Upload G2 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-live-vendor-evidence
          path: artifacts/g2_live_vendor_evidence.json
          if-no-files-found: warn

      - name: G2 summary
        if: always()
        run: |
          {
            echo "## G2 Live Authenticated Vendor Evidence"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Job | ${{ job.status }} |"
            echo "| Drill step | ${{ steps.drill.outcome }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ticker | \`${{ env.DSP_G2_TICKER }}\` |"
            echo "| Environment | \`live-data-evidence\` |"
            echo "| Preferred secret | \`DSP_FMP_API_KEY\` |"
            echo ""
            if [[ -f artifacts/g2_live_vendor_evidence.json ]]; then
              echo '```json'
              cat artifacts/g2_live_vendor_evidence.json
              echo '```'
            else
              echo "_No evidence artifact written._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
