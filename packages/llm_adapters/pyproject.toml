[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-adapters"
version = "0.1.0"
description = "DSP external LLM provider adapters — implements LanguageModelPort outside copilot domain"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "copilot",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
