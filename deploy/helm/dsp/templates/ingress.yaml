{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dsp.fullname" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.app }}
        - {{ .Values.ingress.hosts.api }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.hosts.app }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dsp.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "dsp.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dsp.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
