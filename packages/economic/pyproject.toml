[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "economic"
version = "0.1.0"
description = "Economic Engine — macroeconomic analysis for DSP AI Indicator"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "contracts",
    "core",
]

[tool.setuptools.packages.find]
where = ["src"]
