# DSP AI Indicator — Production compose override (P1.1)
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
#
# Secrets (DSP_JWT_SECRET, DSP_SEED_ADMIN_PASSWORD, DB/Redis URLs) must come from
# a secret manager or a non-committed .env — never bake into the image.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    image: ${DSP_API_IMAGE:-dsp-api}:${DSP_IMAGE_TAG:-1.6.0}
    environment:
      DSP_ENVIRONMENT: production
      DSP_APP_VERSION: ${DSP_APP_VERSION:-1.6.0}
      DSP_ENABLE_SECURITY: "true"
      DSP_REQUIRE_ADMIN_AUTH: "true"
      DSP_RATE_LIMIT_ENABLED: "true"
      DSP_HSTS_ENABLED: "true"
      DSP_INDIA_TIMEZONE: Asia/Kolkata
      DSP_INDIA_CURRENCY: INR
      DSP_REGION: ${DSP_REGION:-ap-south-1}
      TZ: Asia/Kolkata
      LANG: ${LANG:-en_IN.UTF-8}
      DSP_TEMP_DIR: /tmp/dsp
      DSP_BACKUP_DIR: /var/backups/dsp
      # DSP_JWT_SECRET / DSP_SEED_ADMIN_PASSWORD / DSP_DATABASE_URL / DSP_REDIS_URL via env_file/secrets
    volumes:
      - dsp_api_tmp:/tmp/dsp
      - dsp_backups:/var/backups/dsp
    networks:
      - dsp_prod
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${DSP_WEB_IMAGE:-dsp-web}:${DSP_IMAGE_TAG:-2.0.0-rc}
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
    networks:
      - dsp_prod
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    environment:
      TZ: Asia/Kolkata
    volumes:
      - dsp_pg_data:/var/lib/postgresql/data
      - dsp_backups:/var/backups/dsp
    networks:
      - dsp_prod
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging: *default-logging

  redis:
    networks:
      - dsp_prod
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging: *default-logging

networks:
  dsp_prod:
    driver: bridge

volumes:
  dsp_pg_data:
  dsp_api_tmp:
  dsp_backups:
