# ---------------------------------------------------------------------------
# Static typing (Phase A5) — mypy
#
# Covered packages (strict-ish boundary surface):
#   contracts, core, orchestration, dsp_platform
#
# Other packages are not type-checked yet; follow_imports=silent so their
# missing annotations do not fail the gate. See docs/TYPING.md.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = [
    "packages/contracts/src",
    "packages/core/src",
    "packages/dsp/src",
    "packages/data_engine/src",
    "packages/fundamental/src",
    "packages/ai_committee/src",
    "packages/economic/src",
    "packages/snapshot_bridge/src",
    "packages/orchestration/src",
    "packages/recommendation/src",
    "packages/decision_intelligence/src",
    "packages/universe/src",
    "packages/industry/src",
    "packages/comparison/src",
    "packages/portfolio/src",
    "packages/risk/src",
    "packages/research/src",
    "packages/quantitative_risk/src",
    "packages/workflow/src",
    "packages/knowledge_graph/src",
    "packages/copilot/src",
    "packages/llm_adapters/src",
    "packages/dsp_platform/src",
    "packages/valuation/src",
    "packages/financial/src",
    "packages/business_quality/src",
    "packages/economic_moat/src",
    "packages/management_quality/src",
    "packages/financial_strength/src",
    "packages/earnings_quality/src",
    "packages/growth_quality/src",
    "packages/business_quality_aggregator/src",
    "packages/investment_recommendation/src",
    "packages/investment_committee/src",
    "packages/api_platform/src",
    "packages/security_platform/src",
    "packages/production_platform/src",
    "packages/compliance/src",
    "packages/platform_runtime/src",
    "packages/persistence/src",
    "packages/auth/src",
    "packages/admin/src",
    "packages/enterprise/src",
]
files = [
    "packages/contracts/src/contracts",
    "packages/core/src/core",
    "packages/orchestration/src/orchestration",
    "packages/dsp_platform/src/dsp_platform",
]
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
strict_equality = true
extra_checks = true
show_error_codes = true

# Documented exception: mypy targets the 3.12 type system because current
# numpy stubs use ``type`` statements unsupported under --python-version 3.11.
# Runtime still supports Python >=3.11 (see requires-python).

# Application import boundary (enforced in dsp_platform.boundaries /
# packages/dsp_platform/tests/test_boundaries.py). Applications may import
# only: dsp_platform, contracts. Forbidden: data_engine, snapshot_bridge,
# dsp, fundamental, economic, valuation, ai_committee, orchestration,
# recommendation, workflow, knowledge_graph, copilot, core.
