[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_engine"
version = "0.6.0"
description = "DSP AI Indicator data plane — providers, adapters, normalization"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "contracts",
    "core",
]

[tool.setuptools.packages.find]
where = ["src"]
