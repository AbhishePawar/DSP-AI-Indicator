name: Temporary Black Formatting Remediation

on:
  push:
    branches:
      - fix/missing-shares-ai-research
    paths:
      - ".github/workflows/temporary-black-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/missing-shares-ai-research
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository formatter
        run: python -m pip install --upgrade black
      - name: Format Python package and test files
        run: black packages tests
      - name: Verify formatting
        run: black --check packages tests
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages tests
          git commit -m "style(python): apply configured Black formatting"
          git push origin HEAD:fix/missing-shares-ai-research
