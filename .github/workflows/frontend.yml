name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # One-time security dependency refresh for the deployment-readiness PR.
      # This branch-scoped step is removed after the generated lockfile is committed.
      - name: Checkout readiness branch for lock refresh
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/deployment-readiness-20261014'
        working-directory: .
        run: |
          git fetch origin fix/deployment-readiness-20261014
          git checkout -B fix/deployment-readiness-20261014 origin/fix/deployment-readiness-20261014

      - name: Resolve updated frontend lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/deployment-readiness-20261014'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/deployment-readiness-20261014'
        working-directory: .
        run: |
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): refresh frontend lockfile"
          git push origin HEAD:fix/deployment-readiness-20261014

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Accessibility automation
        run: yarn test:a11y

      - name: Performance automation
        run: yarn test:perf

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_PUBLIC_BUILD_TIMESTAMP: ${{ github.run_id }}
        run: yarn build

      - name: Bundle size budget
        run: yarn perf:budget -- --require-build
