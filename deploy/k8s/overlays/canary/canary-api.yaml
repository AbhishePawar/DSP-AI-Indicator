apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsp-api-canary
  namespace: dsp
  labels:
    app.kubernetes.io/name: dsp-api-canary
    dsp.platform/track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsp-api-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsp-api-canary
        dsp.platform/track: canary
    spec:
      containers:
        - name: api
          image: dsp-api:2.0.1-canary
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dsp-config
            - secretRef:
                name: dsp-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dsp-api-canary
  namespace: dsp
spec:
  selector:
    app.kubernetes.io/name: dsp-api-canary
  ports:
    - port: 8000
      targetPort: http
