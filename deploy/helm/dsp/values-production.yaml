api:
  replicaCount: 3
  image:
    tag: "2.0.0"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12

web:
  replicaCount: 3
  image:
    tag: "2.0.0"

config:
  DSP_ENVIRONMENT: production
  DSP_REDIS_FALLBACK: "false"
  DSP_OTEL_ENABLED: "true"

# Recommended: disable in-cluster Postgres/Redis; point secrets at managed URLs
postgres:
  enabled: false

redis:
  enabled: false

ingress:
  hosts:
    app: app.your-domain.example
    api: api.your-domain.example

observability:
  otelCollector:
    enabled: true
