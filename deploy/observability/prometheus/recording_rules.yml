# Recording rules for production SLIs (EPIC-017)
groups:
  - name: dsp_sli_recording
    interval: 30s
    rules:
      - record: dsp:api_latency_p95_ms
        expr: histogram_quantile(0.95, sum(rate(dsp_http_request_duration_ms_bucket[5m])) by (le, route))

      - record: dsp:api_latency_p99_ms
        expr: histogram_quantile(0.99, sum(rate(dsp_http_request_duration_ms_bucket[5m])) by (le, route))

      - record: dsp:api_error_ratio_5m
        expr: |
          sum(rate(dsp_http_errors_total[5m]))
          /
          clamp_min(sum(rate(dsp_http_requests_total[5m])), 0.001)

      - record: dsp:redis_hit_ratio
        expr: |
          sum(rate(redis_keyspace_hits_total[5m]))
          /
          clamp_min(
            sum(rate(redis_keyspace_hits_total[5m])) + sum(rate(redis_keyspace_misses_total[5m])),
            0.001
          )

      - record: dsp:pg_avg_query_ms
        expr: avg(pg_stat_activity_max_tx_duration) * 1000

      - record: dsp:queue_depth
        expr: max(dsp_job_queue_depth) or vector(0)
