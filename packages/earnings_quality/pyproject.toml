[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings_quality"
version = "0.1.0"
description = "Earnings Quality & Predictability Intelligence for DSP AI Indicator (FEATURE-004)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "core",
    "financial",
    "business_quality",
]

[tool.setuptools.packages.find]
where = ["src"]
