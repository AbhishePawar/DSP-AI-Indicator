[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-platform"
version = "0.1.0"
description = "DSP API Platform — FastAPI HTTP surface over dsp_platform (K1.1)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "dsp_platform",
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
