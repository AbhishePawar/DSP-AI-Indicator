name: Release

# Tag release packaging — hard-gated by:
#   P1-09 → P1-10 → G11 → G2 (live-data-evidence) → P1-11 RC aggregator → publish
# Create GitHub Release runs ONLY after RC1 hard gate PASS.
# Soft-fail / || true / continue-on-error on critical gates is forbidden.
#
# G2 is owned by reusable workflow g2-live-vendor-evidence.yml using
# environment ``live-data-evidence``. Missing credential ⇒ G2 job fails ⇒ NO-GO.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

jobs:
  p109-api:
    name: P1-09 API critical journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSP_ENVIRONMENT: development
      PYTHONUNBUFFERED: "1"
      DSP_SEED_ADMIN_PASSWORD: Admin@123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install monorepo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: P1-09 API hard-gate
        run: |
          pytest \
            packages/api_platform/tests/test_p109_critical_investment_journey.py \
            -q --tb=short --import-mode=importlib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-p109-evidence
          path: artifacts/p109_critical_investment_evidence.json
          if-no-files-found: warn

  p110-authenticity:
    name: P1-10 authenticity hard-fail
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DSP_ENVIRONMENT: development
      PYTHONUNBUFFERED: "1"
      DSP_SEED_ADMIN_PASSWORD: Admin@123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install monorepo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: P1-10 authenticity hard-fail
        run: python scripts/ci/run_p110_authenticity_hard_fail.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-p110-evidence
          path: |
            artifacts/p110_authenticity_ci_summary.json
            artifacts/p110_authenticity_hard_fail_evidence.json
            artifacts/p109_critical_investment_evidence.json
          if-no-files-found: warn

  g11-postgres:
    name: G11 Postgres restore (release prerequisite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp_g11_ci_only
          POSTGRES_DB: dsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsp -d dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSP_DATABASE_URL: postgresql://dsp:dsp_g11_ci_only@localhost:5432/dsp
      DSP_BACKUP_DIR: ${{ github.workspace }}/backups
      DSP_BACKUP_ADAPTER: shell
      DSP_BACKUP_RESTORE_CONFIRM: "YES"
      DSP_INFRA_OFFLINE: "0"
      DSP_ENVIRONMENT: development
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gzip
      - name: Install monorepo + psycopg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install 'psycopg[binary]>=3.1'
      - name: G11 postgres restore drill
        run: python scripts/ops/g11_postgres_restore_drill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-g11-evidence
          path: artifacts/g11_postgres_restore_evidence.json
          if-no-files-found: warn

  # Authoritative G2 — reusable workflow owns live-data-evidence secrets.
  # Hard-fails when credential absent or evidence_class ≠ real_live_authenticated_provider.
  g2-live-vendor:
    name: G2 live authenticated vendor evidence
    uses: ./.github/workflows/g2-live-vendor-evidence.yml
    secrets: inherit
    with:
      ticker: AAPL

  rc1-hard-gate:
    name: P1-11 RC1 hard gate (release blocking)
    runs-on: ubuntu-latest
    # P1-11 waits for P1-09, P1-10, G11, and G2.
    # G2 may finish as failure (BLOCKED evidence uploaded); P1-11 then
    # evaluates to NO-GO. Publish still requires this job to succeed.
    needs: [p109-api, p110-authenticity, g11-postgres, g2-live-vendor]
    if: >-
      always()
      && !cancelled()
      && needs.p109-api.result == 'success'
      && needs.p110-authenticity.result == 'success'
      && needs.g11-postgres.result == 'success'
      && contains(fromJSON('["success","failure"]'), needs.g2-live-vendor.result)
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      # G2 clearance is artifact-authoritative (from g2-live-vendor job).
      # Do NOT inject repository-level vendor secrets here — that bypassed
      # the protected live-data-evidence environment boundary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download prerequisite evidence
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Normalize evidence paths
        run: |
          mkdir -p artifacts
          find artifacts -type f -name '*.json' -print
          # download-artifact may nest by artifact name; flatten known files.
          for f in \
            p109_critical_investment_evidence.json \
            p110_authenticity_ci_summary.json \
            p110_authenticity_hard_fail_evidence.json \
            g11_postgres_restore_evidence.json \
            g2_live_vendor_evidence.json; do
            found=$(find artifacts -type f -name "$f" | head -n 1 || true)
            if [ -n "$found" ] && [ "$found" != "artifacts/$f" ]; then
              cp "$found" "artifacts/$f"
            fi
          done
          test -f artifacts/g2_live_vendor_evidence.json
      - name: Require G2 clearance artifact before evaluate
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("artifacts/g2_live_vendor_evidence.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          cleared = (
              data.get("ok") is True
              and data.get("g2_status") == "CLEARED"
              and data.get("evidence_class") == "real_live_authenticated_provider"
          )
          print(
              "g2_artifact "
              f"ok={data.get('ok')} "
              f"g2_status={data.get('g2_status')} "
              f"evidence_class={data.get('evidence_class')}"
          )
          if not cleared:
              print(
                  "G2 BLOCKED — release cannot evaluate as GO without "
                  "real_live_authenticated_provider evidence",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: RC1 hard gate evaluate
        id: rc1_gate
        run: python scripts/ci/rc1_hard_release_gate.py --evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rc1-hard-gate
          path: artifacts/rc1_hard_release_gate.json
          if-no-files-found: warn

  publish:
    name: Build package + publish GitHub Release
    runs-on: ubuntu-latest
    needs: [rc1-hard-gate]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install monorepo
        run: pip install -e ".[dev]"

      - name: Validate release versions
        run: python scripts/release/validate_release.py --tag ${{ github.ref_name }}

      - name: Build release package
        run: python scripts/release/build_release_package.py

      - name: Certify P7.2
        run: python scripts/ops/certify_p7_2.py

      - name: Health contract + quality gates
        run: |
          pytest packages/api_platform/tests/test_health_rc1.py -q
          pytest packages -q --import-mode=importlib -p no:cov --tb=line -x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend tests & build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_BUILD_TIMESTAMP: ${{ github.sha }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Build container images
        run: |
          docker build -f docker/backend/Dockerfile -t dsp-api:${{ github.ref_name }} .
          docker build -f docker/frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_BUILD_TIMESTAMP=${{ github.sha }} \
            -t dsp-web:${{ github.ref_name }} .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .env.production.example
