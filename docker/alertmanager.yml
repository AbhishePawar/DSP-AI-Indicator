# EPIC-P7.4 — Alertmanager (ops only).
# Replace webhook/email receivers with real secrets via env / secret manager in live deploy.
global:
  resolve_timeout: 5m

route:
  receiver: dsp-ops-default
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: dsp-ops-critical
      continue: true
    - matchers:
        - severity = warning
      receiver: dsp-ops-default

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["service", "alertname"]

receivers:
  - name: dsp-ops-default
    webhook_configs:
      - url: "http://127.0.0.1:9/dsp-ops-webhook-placeholder"
        send_resolved: true
        # Operators must replace with Slack/PagerDuty/Opsgenie webhook URL.
  - name: dsp-ops-critical
    webhook_configs:
      - url: "http://127.0.0.1:9/dsp-ops-critical-webhook-placeholder"
        send_resolved: true
