apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsp-web
  namespace: dsp
  labels:
    app.kubernetes.io/name: dsp-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsp-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsp-web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: dsp-web:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Asia/Kolkata
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dsp-web
  namespace: dsp
  labels:
    app.kubernetes.io/name: dsp-web
spec:
  selector:
    app.kubernetes.io/name: dsp-web
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dsp-web
  namespace: dsp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsp-web
