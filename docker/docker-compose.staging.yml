# Staging overlay: load .env.staging values into the container after the base .env.
# Run from the repository root:
# docker compose --env-file .env.staging -f docker/docker-compose.yml -f docker/docker-compose.staging.yml up -d --build
services:
  api:
    env_file:
      - ../.env.staging
    environment:
      DSP_ENVIRONMENT: staging
      DSP_CORS_ORIGINS: ${DSP_CORS_ORIGINS:-https://staging.your-domain.example}
      DSP_DATABASE_URL: ${DSP_DATABASE_URL:?Set DSP_DATABASE_URL in .env.staging}
      DSP_REDIS_URL: ${DSP_REDIS_URL:-}
      DSP_REGION: ${DSP_REGION:-ap-south-1}
      DSP_OBJECT_STORAGE_PROVIDER: ${DSP_OBJECT_STORAGE_PROVIDER:-local}
      DSP_OBJECT_STORAGE_LOCAL_ROOT: ${DSP_OBJECT_STORAGE_LOCAL_ROOT:-/var/lib/dsp/artifacts}
      DSP_BACKUP_S3_BUCKET: ${DSP_BACKUP_S3_BUCKET:-}
      DSP_BACKUP_S3_REGION: ${DSP_BACKUP_S3_REGION:-ap-south-1}
      DSP_STORAGE_OVERFLOW_THRESHOLD: ${DSP_STORAGE_OVERFLOW_THRESHOLD:-0.95}
