# Reference Postgres StatefulSet for non-managed environments.
# Production preference: managed Postgres with automated backups + PITR (RDS / Cloud SQL / Azure).
# No schema redesign in EPIC-017 — ops wiring only.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dsp
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dsp
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: dsp
            - name: POSTGRES_DB
              value: dsp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsp-secrets
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: Asia/Kolkata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dsp", "-d", "dsp"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dsp", "-d", "dsp"]
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
