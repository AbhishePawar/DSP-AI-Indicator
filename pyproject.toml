    "packages/risk/src",
    "packages/research/src",
    "packages/quantitative_risk/src",
    "packages/workflow/src",
    "packages/knowledge_graph/src",
    "packages/copilot/src",
    "packages/llm_adapters/src",
    "packages/dsp_platform/src",
    "packages/valuation/src",
    "packages/financial/src",
    "packages/business_quality/src",
    "packages/economic_moat/src",
    "packages/management_quality/src",
    "packages/financial_strength/src",
    "packages/earnings_quality/src",
    "packages/growth_quality/src",
    "packages/business_quality_aggregator/src",
    "packages/investment_recommendation/src",
    "packages/investment_committee/src",
    "packages/api_platform/src",
    "packages/security_platform/src",
    "packages/production_platform/src",
    "packages/compliance/src",
    "packages/platform_runtime/src",
    "packages/persistence/src",
    "packages/auth/src",
