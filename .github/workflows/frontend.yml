name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Accessibility automation
        run: yarn test:a11y

      - name: Performance automation
        run: yarn test:perf

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_PUBLIC_BUILD_TIMESTAMP: ${{ github.run_id }}
        run: yarn build

      - name: Bundle size budget
        run: yarn perf:budget -- --require-build
