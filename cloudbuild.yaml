# Cloud Build — API image → Artifact Registry → Cloud Run
#
# Build context is the repository root (this file's directory).
# Dockerfile: docker/backend/Dockerfile
#
# Trigger: use Repository configuration (this file), not Inline.
# Do not set the trigger's Dockerfile directory to docker/backend.

substitutions:
  _REGION: asia-south1
  _SERVICE: dsp-ai-indicator
  _AR_REPOSITORY: dsp-ai-indicator
  _IMAGE: dsp-ai-indicator

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/backend/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:latest
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:$COMMIT_SHA

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8000
      - --set-env-vars=DSP_ENVIRONMENT=production,DSP_REGION=ap-south-1,DSP_INVESTMENT_DATA_PROVIDER=upstox,DSP_AUTH_MAGIC_LINK=true,DSP_RESEND_FROM_ADDRESS=noreply@dspaindicator.com,DSP_CORS_ORIGINS=https://dsp-ai-indicator-web-6uxsluxowq-el.a.run.app,https://dspaindicator.com,https://www.dspaindicator.com
      # Keep every production auth secret required by the backend on every revision.
      # --set-secrets replaces the secret-env configuration, so Google OAuth must be
      # included here rather than mounted only by a one-off post-deploy command.
      # Do not mount Upstox credentials here — auth/API boot must not require investment tokens.
      - --set-secrets=DSP_DATABASE_URL=dsp-database-url:latest,DSP_AUTH_JWT_SECRET=dsp-auth-jwt-secret:latest,DSP_RESEND_API_KEY=dsp-resend-api-key:latest,DSP_GOOGLE_CLIENT_ID=dsp-google-client-id:latest,DSP_GOOGLE_CLIENT_SECRET=dsp-google-client-secret:latest
      - --add-cloudsql-instances=project-34de429e-3c43-4ae7-b75:asia-south1:dsp-postgres
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE:latest
